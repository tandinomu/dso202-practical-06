# cluster/kind-cluster.yaml - three-node kind cluster for the practical.
# Host port 30080 is mapped into the cluster so the dev release's NodePort
# is reachable at http://localhost:30080.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dso202
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
  - role: worker
  - role: worker
