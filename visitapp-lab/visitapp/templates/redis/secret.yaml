{{- /*
redis/secret.yaml - the Redis password, read by Redis and by the backend.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "visitapp.redisSecretName" . }}
  labels:
    {{- include "visitapp.labels" (dict "ctx" . "component" "redis") | nindent 4 }}
type: Opaque
data:
  redis-password: {{ include "visitapp.redisPassword" . | b64enc | quote }}
