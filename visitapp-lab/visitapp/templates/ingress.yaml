{{- /*
ingress.yaml - optional HTTP route to the frontend from outside the cluster.
Needs an ingress controller (for example ingress-nginx) in the cluster.
*/}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "visitapp.fullname" . }}
  labels:
    {{- include "visitapp.labels" (dict "ctx" . "component" "frontend") | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "visitapp.componentName" (dict "ctx" . "component" "frontend") }}
                port:
                  name: http
{{- end }}
